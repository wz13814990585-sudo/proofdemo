[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "proofdemo"
version = "0.1.0"
description = "Verified, replayable product demo generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "playwright>=1.55,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
proofdemo = "proofdemo.cli:main"
proofdemo-api = "proofdemo.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/proofdemo"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["backend/src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["proofdemo"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["backend/src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["uvicorn"]
ignore_missing_imports = true
