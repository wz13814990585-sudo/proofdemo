name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade 'pip>=26.2,<27'
          python -m pip install -e '.[dev]'
      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Check generated DemoSpec schema
        run: |
          python scripts/export_schema.py
          git diff --exit-code -- shared/schemas/demo_spec.schema.json
      - name: Run release benchmark
        run: proofdemo benchmark --output /tmp/proofdemo-benchmark.json
      - name: Audit Python dependencies
        run: python -m pip_audit --skip-editable
      - name: Run tests
        run: python -m pytest
      - name: Check formatting and lint
        run: |
          ruff format --check .
          ruff check .
      - name: Check Python types
        run: mypy backend/src
      - name: Build frontend
        run: npm --prefix frontend run build
